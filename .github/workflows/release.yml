name: Build & release

# Every push to main builds the installer. When package.json has a version that
# has no release yet, a release "v<version>" is created with the installer attached.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build installer
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImgViewer-windows
          path: dist/ImgViewer-Setup-*.exe

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          FILE=$(ls dist/ImgViewer-Setup-*.exe)
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "branch" ]; then
              echo "Release $TAG already exists; bump the version in package.json to publish a new one."
              exit 0
            fi
            gh release upload "$TAG" "$FILE" --clobber
          else
            cat > notes.md <<NOTES
          Download **$(basename "$FILE")** below, run it, and ImgViewer installs and opens — no admin rights needed.

          Windows may show a SmartScreen warning because the installer isn't code-signed: click **More info → Run anyway**.
          NOTES
            gh release create "$TAG" "$FILE" --target "$GITHUB_SHA" --title "ImgViewer $VERSION" --notes-file notes.md
          fi
